name: Userscript checks

on:
  pull_request:
    paths:
      - "src/**"
      - "userscripts/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "userscripts/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and deterministic build
        run: |
          node --check src/exporter-core.js
          node --check src/profiling.js
          node --check src/compression.js
          node --check src/userscript-entry.js
          node --check userscripts/chatgpt-conversation-export.user.js
          node scripts/build-userscript.js --check
      - name: Node-native unit tests
        run: node --test tests/*.test.js
